name: Build Shwan Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: داگرتنی کۆدەکان (Checkout)
        uses: actions/checkout@v4

      - name: دامەزراندنی Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: دامەزراندنی Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: دروستکردنی فایلی APK (Debug APK)
        run: gradle assembleDebug --no-daemon

      - name: بەرزکردنەوەی فایلی ئامادەکراوی Shwan-APK
        uses: actions/upload-artifact@v4
        with:
          name: Shwan-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
