<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەیوەندی ئینتەرنێت نییە</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }
        .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #38bdf8;
        }
        p {
            font-size: 15px;
            line-height: 1.7;
            color: #cbd5e1;
            margin-bottom: 24px;
        }
        button {
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            background: #0369a1;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>ئینتەرنێت بەردەست نییە</h1>
        <p>تکایە دڵنیابەرەوە لە کارکردنی Wi-Fi یان داتای مۆبایلەکەت بۆ کردنەوەی وێبسایتی شوان.</p>
        <button onclick="window.location.href='https://shwan.unaux.com/'">دووبارە هەوڵبدەرەوە</button>
    </div>
</body>
</html>
